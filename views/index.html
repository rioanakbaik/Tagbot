<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>METAVERSE Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0F0F0F;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Background efek */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at center, rgba(245,158,11,0.08) 0%, transparent 60%);
      pointer-events: none;
    }

    .container {
      text-align: center;
      z-index: 1;
      padding: 2rem;
    }

    .logo {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, #F59E0B, #D97706);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
      font-size: 2.5rem;
      box-shadow: 0 0 40px rgba(245,158,11,0.4);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 40px rgba(245,158,11,0.4); }
      50% { box-shadow: 0 0 60px rgba(245,158,11,0.7); }
    }

    h1 {
      font-size: 3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #F59E0B, #FCD34D);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
      letter-spacing: -1px;
    }

    .subtitle {
      color: #6B7280;
      font-size: 1.1rem;
      margin-bottom: 3rem;
    }

    .card {
      background: #1A1A1A;
      border: 1px solid #2A2A2A;
      border-radius: 20px;
      padding: 2.5rem;
      max-width: 420px;
      width: 100%;
      margin: 0 auto;
    }

    .card h2 {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .card p {
      color: #6B7280;
      margin-bottom: 2rem;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .btn-discord {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      background: #5865F2;
      color: #fff;
      text-decoration: none;
      padding: 0.9rem 2rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
      width: 100%;
    }

    .btn-discord:hover {
      background: #4752C4;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(88,101,242,0.4);
    }

    .btn-discord svg {
      width: 24px;
      height: 24px;
      fill: white;
    }

    .features {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .feature {
      background: #1A1A1A;
      border: 1px solid #2A2A2A;
      border-radius: 12px;
      padding: 1rem 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #9CA3AF;
    }

    .feature span:first-child {
      font-size: 1.2rem;
    }

    .footer {
      margin-top: 3rem;
      color: #374151;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">⚡</div>
    <h1>METAVERSE</h1>
    <p class="subtitle">Dashboard Bot Discord</p>

    <div class="card">
      <h2>Selamat Datang! 👋</h2>
      <p>Login dengan akun Discord kamu untuk mengakses dashboard dan mengatur bot METAVERSE.</p>
      <a href="/auth/discord" class="btn-discord">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057.101 18.08.114 18.1.132 18.11a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
        </svg>
        Login dengan Discord
      </a>
    </div>

    <div class="features">
      <div class="feature"><span>👋</span><span>Welcome & Goodbye</span></div>
      <div class="feature"><span>🏷️</span><span>Server Tag Role</span></div>
      <div class="feature"><span>⚙️</span><span>Mudah Dikonfigurasi</span></div>
    </div>

    <p class="footer">© 2024 METAVERSE Dashboard. All rights reserved.</p>
  </div>
</body>
</html>
